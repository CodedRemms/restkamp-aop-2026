<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Song lineups and uniform schedule for the RESTKAMP Choir's Assemblies of Praise programme.">
<meta property="og:title" content="Assemblies of Praise · RESTKAMP Choir">
<meta property="og:description" content="Tap to see each day's Praise & Worship and Ministration lineup, plus uniforms.">
<meta name="theme-color" content="#2b1f5c">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Assemblies of Praise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow phone column — header band, then one block per day with two big tap targets; tapping opens a full lineup view */
:root{
  --bg:#f6f4fb; --surface:#ffffff; --ink:#1d1830; --muted:#625b78; --line:#e2ddef;
  --band:#2b1f5c; --band-ink:#fbf7ec; --gold:#d9a521; --gold-ink:#3a2a00;
  --pw:#2b1f5c; --min:#8a3b12; --pw-soft:#ece8fa; --min-soft:#fbeee6;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120f1d; --surface:#1d1930; --ink:#f1eef9; --muted:#aaa3c2; --line:#2f2948;
  --band:#211845; --band-ink:#fbf7ec; --gold:#e8b938; --gold-ink:#2a1e00;
  --pw:#b9a9ff; --min:#f2a476; --pw-soft:#262043; --min-soft:#2e1f1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120f1d; --surface:#1d1930; --ink:#f1eef9; --muted:#aaa3c2; --line:#2f2948;
  --band:#211845; --band-ink:#fbf7ec; --gold:#e8b938; --gold-ink:#2a1e00;
  --pw:#b9a9ff; --min:#f2a476; --pw-soft:#262043; --min-soft:#2e1f1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--band);color:var(--band-ink)}
header .wrap{padding-block:28px 26px;display:grid;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,48px);line-height:1;margin:0;text-wrap:balance}
.sub{margin:4px 0 0;opacity:.85;font-size:15px}
main .wrap{padding-block:20px 40px;display:grid;gap:22px}
.notice{background:var(--gold);color:var(--gold-ink);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:500}
.day{display:grid;gap:10px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dayhead h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0}
.dayhead .date{color:var(--muted);font-size:14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:4px;align-content:space-between;min-height:104px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);transition:transform .12s ease,border-color .12s}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn:active{transform:scale(.97)}
.btn .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.btn .t{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1}
.btn .lead{font-size:13px;color:var(--muted)}
.btn.pw{background:var(--pw-soft)} .btn.pw .k,.btn.pw .t{color:var(--pw)}
.btn.min{background:var(--min-soft)} .btn.min .k,.btn.min .t{color:var(--min)}
.uni{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.swatch{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);flex:none}
.allbtn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:14px;border-radius:14px;background:var(--band);color:var(--band-ink);font-weight:600}
.allbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* Detail view */
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--band);color:var(--band-ink);z-index:5}
.top .wrap{padding-block:12px;display:flex;align-items:center;gap:12px}
.back{all:unset;box-sizing:border-box;cursor:pointer;font-weight:700;font-size:17px;min-height:48px;display:inline-flex;align-items:center;gap:6px;padding:0 20px;border-radius:999px;background:var(--gold);color:var(--gold-ink);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.back:focus-visible{outline:3px solid var(--gold)}
.top .crumb{font-size:14px;opacity:.85;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead{display:grid;gap:4px}
.dhead h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
ol.songs{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
ol.songs li{counter-increment:s;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
ol.songs li::before{content:counter(s);font-family:var(--display);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.song{min-width:0}
.song b{display:block;font-weight:600}
.song span{font-size:13px;color:var(--muted)}
.yt{font-size:13px;font-weight:600;text-decoration:none;padding:8px 12px;border-radius:999px;background:var(--gold);color:var(--gold-ink);white-space:nowrap}
.yt:focus-visible{outline:3px solid var(--ink)}
.section-label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 -2px}
.empty{padding:18px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);text-align:center}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top}
th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
footer{color:var(--muted);font-size:13px;text-align:center}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>


<div id="home">
  <header><div class="wrap">
    <a href="https://restkamp-choir-hub.vercel.app" style="display:inline-flex;align-items:center;gap:6px;width:max-content;min-height:44px;padding:0 18px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:15px;text-decoration:none;margin-bottom:8px">← RESTKAMP Choir Hub</a>
    <h1 id="progName">Assemblies of Praise</h1>
    <p class="sub" id="progDates"></p>
  </div></header>
  <main><div class="wrap" id="homeBody"></div></main>
</div>

<div id="detail" hidden>
  <div class="top"><div class="wrap">
    <button class="back" id="backBtn" type="button">← Back</button>
    <span class="crumb" id="crumb"></span>
  </div></div>
  <main><div class="wrap" id="detailBody"></div></main>
</div>

<style>
.yt.search{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.part{display:grid;gap:8px}
.parthead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.parthead h3{font-family:var(--display);font-weight:800;font-size:20px;margin:0}
.parthead .who{font-size:14px;color:var(--muted)}
.wear{display:grid;gap:6px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.wear div{display:grid;grid-template-columns:62px 1fr;gap:8px}
.wear b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.swatches{display:inline-flex;gap:3px;flex:none}
.swatch.ankara{background:conic-gradient(#e0572b 0 25%,#f2b632 0 50%,#1f7a5a 0 75%,#2b1f5c 0)!important}
</style>
<style>
.notice{background:var(--gold);color:var(--gold-ink);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:500}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{all:unset;box-sizing:border-box;cursor:pointer;font-weight:600;font-size:14px;padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.tbtn.primary{background:var(--band);border-color:var(--band);color:var(--band-ink)}
.tbtn.danger{color:#c0392b}
.tbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tbtn[disabled]{opacity:.5;pointer-events:none}
.card{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line)}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.field input:focus{outline:2px solid var(--gold);border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.songed{display:grid;gap:6px;padding:10px;border-radius:12px;border:1px dashed var(--line)}
.songed .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.mini{all:unset;cursor:pointer;width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line);font-size:15px;color:var(--ink)}
.mini:focus-visible{outline:2px solid var(--gold)}
.minis{display:flex;gap:4px}
.msg{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--pw-soft);color:var(--ink)}
.msg.err{background:var(--min-soft);color:var(--min)}
.pinrow{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.pinrow .field{flex:1 1 160px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
</style>
<script>
/* Lineups (songs, leads) live in the Choir Hub database and are edited on the page.
   Only the programme dates and uniforms are set here. */
const SB_URL = "https://kuubzlcggvvmuldasmzu.supabase.co";
const SB_KEY = "sb_publishable_tILHIHGE0jnhrr7y26yBAw_aSCqZZke";
const PROGRAMME = {
  name: "Assemblies of Praise 2026",
  dates: "Tue 29 – Thu 31 December 2026",
  days: [
    { date:"Tue 29 Dec", uniform:{ gents:"Sky blue shirt + deep blue trousers", ladies:"Sky blue blouse + deep blue skirt / trousers + pumps", colors:["#87c3ea","#1f3a8a"] }, pw:[], min:[] },
    { date:"Wed 30 Dec", uniform:{ gents:"Black shirt + black trousers + colourful tie", ladies:"Black dress + coloured blazer + black pumps", colors:["#111111","#c0392b"] }, pw:[], min:[] },
    { date:"Thu 31 Dec", uniform:{ gents:"Black trousers + anniversary Ankara shirt", ladies:"Anniversary Ankara kimono dress + black head tie", colors:["#111111","ankara"] }, pw:[], min:[] }
  ]
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LABEL = {pw:"Praise & Worship", min:"Ministration"};
const DEFAULT_SECTION = {pw:"Praise", min:"Ministration"};
const search = s => "https://www.youtube.com/results?search_query=" + encodeURIComponent(s.t + " " + (s.by||""));
const swatches = u => `<span class="swatches">${u.colors.map(c=>c==="ankara"?`<span class="swatch ankara"></span>`:`<span class="swatch" style="background:${esc(c)}"></span>`).join("")}</span>`;
const leads = parts => parts.filter(p=>p.lead).map(p=>`${/worship/i.test(p.name)?"Worship":p.name}: ${p.lead}`).filter((v,i,a)=>a.indexOf(v)===i).join(" · ");
const count = parts => parts.reduce((n,p)=>n+p.songs.length,0);

let state = "loading";            // loading | ready | error
let current = "";                 // current view token
let editing = null;               // {n,k,sections:[...],deleted:[]}
let pin = ""; try{ pin = sessionStorage.getItem("aopPin")||""; }catch(e){}

async function api(path, opts={}){
  const r = await fetch(SB_URL + "/rest/v1/" + path, {...opts, headers:{apikey:SB_KEY, "Content-Type":"application/json", ...(opts.headers||{})}});
  const txt = await r.text(); let data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok) throw new Error((data && (data.message||data.hint)) || "Request failed ("+r.status+")");
  return data;
}
const rpc = (fn, args) => api("rpc/"+fn, {method:"POST", body:JSON.stringify(args)});

async function load(){
  try{
    const rows = await api("aop_sections?select=id,day,slot,name,lead,position,aop_songs(position,title,artist,youtube_url)&order=position.asc");
    PROGRAMME.days.forEach(d=>{ d.pw=[]; d.min=[]; });
    rows.forEach(r=>{
      const d = PROGRAMME.days[r.day-1]; if(!d) return;
      d[r.slot].push({ id:r.id, name:r.name, lead:r.lead||"", position:r.position,
        songs:(r.aop_songs||[]).sort((a,b)=>a.position-b.position).map(s=>({t:s.title, by:s.artist||"", yt:s.youtube_url||""})) });
    });
    state = "ready";
  }catch(e){ state = "error"; }
  renderHome(); if(current && !editing) renderDetail(current);
}

function renderHome(){
  $("progName").textContent = PROGRAMME.name;
  $("progDates").textContent = PROGRAMME.dates;
  let h = state==="error" ? `<div class="notice">Couldn't load the latest lineups. Check your connection and refresh the page.</div>` : "";
  PROGRAMME.days.forEach((d,i)=>{
    const n=i+1;
    h += `<section class="day">
      <div class="dayhead"><h2>Day ${n}</h2><span class="date">${esc(d.date)}</span></div>
      <div class="btns">
        ${["pw","min"].map(k=>{ const c=count(d[k]);
          const sub = state==="loading" ? "Loading…" : state==="error" ? "Couldn't load" : c ? (leads(d[k]) || c+" songs") : (leads(d[k]) || "Not posted yet");
          return `<button class="btn ${k}" type="button" data-go="day${n}-${k}">
          <span class="k">Day ${n}</span><span class="t">${LABEL[k]}</span>
          <span class="lead">${esc(sub)}</span></button>`;}).join("")}
      </div>
      <div class="uni">${swatches(d.uniform)}Uniform: ${esc(d.uniform.gents.split(" + ")[0])} &amp; more</div>
    </section>`;
  });
  h += `<button class="allbtn" type="button" data-go="uniforms">Uniform schedule (all days)</button>
        <footer>Tap any button to see the lineup. Songs open on YouTube.<br>To add or change songs, open a lineup and tap “Edit lineup”.</footer>`;
  $("homeBody").innerHTML = h;
}

const wear = u => `<div class="wear"><div><b>Gents</b><span>${esc(u.gents)}</span></div><div><b>Ladies</b><span>${esc(u.ladies)}</span></div></div>`;

function renderDetail(token){
  let m = token.match(/^day(\d)-(pw|min)$/), body="", crumb="";
  if(m){
    const n=+m[1], k=m[2], d=PROGRAMME.days[n-1]; if(!d) return false;
    crumb = `Day ${n} · ${LABEL[k]}`;
    const head = `<div class="dhead"><span class="eyebrow" style="color:var(--${k})">Day ${n} · ${esc(d.date)}</span><h2>${LABEL[k]}</h2></div>`;
    if(editing && editing.n===n && editing.k===k){
      body = head + renderEditor();
    } else {
      const parts = state==="loading" ? `<div class="empty">Loading lineup…</div>`
        : d[k].length ? d[k].map(p=>`<div class="part">
        <div class="parthead"><h3>${esc(p.name)}</h3>${p.lead?`<span class="who">Lead: <b>${esc(p.lead)}</b></span>`:""}</div>
        ${p.songs.length ? `<ol class="songs">${p.songs.map(s=>`<li>
          <div class="song"><b>${esc(s.t)}</b>${s.by?`<span>${esc(s.by)}</span>`:""}</div>
          ${s.yt ? `<a class="yt" href="${esc(s.yt)}" target="_blank" rel="noopener">▶ Play</a>`
                 : `<a class="yt search" href="${search(s)}" target="_blank" rel="noopener">Find</a>`}</li>`).join("")}</ol>`
          : `<div class="empty">Songs to be confirmed.</div>`}
      </div>`).join("")
      : `<div class="empty">The ${LABEL[k]} lineup for Day ${n} has not been posted yet. Check back soon.</div>`;
      const tools = state==="ready" ? `<div class="tools"><button class="tbtn primary" type="button" data-edit="${n}-${k}">${d[k].length?"✎ Edit lineup":"+ Add lineup"}</button></div>` : "";
      body = head + tools + `<div class="section-label">Wear today</div>${wear(d.uniform)}` + parts;
    }
  } else if(token==="uniforms"){
    crumb="Uniform schedule";
    body = `<div class="dhead"><span class="eyebrow">AOP 2026</span><h2>Uniform schedule</h2></div>
      ${PROGRAMME.days.map((d,i)=>`<div class="part"><div class="parthead"><h3>Day ${i+1}</h3><span class="who">${swatches(d.uniform)} ${esc(d.date)}</span></div>${wear(d.uniform)}</div>`).join("")}`;
  } else return false;
  $("crumb").textContent = crumb;
  $("detailBody").innerHTML = body;
  return true;
}

/* ---------- Editing ---------- */
function startEdit(n,k){
  const d = PROGRAMME.days[n-1];
  editing = { n, k, unlocked: true, msg:"", err:false, busy:false, deleted:[],
    sections: d[k].length ? d[k].map(p=>({id:p.id, name:p.name, lead:p.lead, songs:p.songs.map(s=>({...s}))}))
                          : [{id:null, name:DEFAULT_SECTION[k], lead:"", songs:[{t:"",by:"",yt:""}]}] };
  renderDetail(current);
}

function renderEditor(){
  const e = editing;
  const msg = e.msg ? `<div class="msg ${e.err?"err":""}">${esc(e.msg)}</div>` : "";
  if(!e.unlocked){
    return `${msg}<div class="card"><div class="pinrow">
      <div class="field"><label for="pinInput">Leads' PIN</label><input id="pinInput" type="password" autocomplete="off" inputmode="text"></div>
      <button class="tbtn primary" type="button" data-act="unlock">Unlock</button>
      <button class="tbtn" type="button" data-act="cancel">Cancel</button></div>
      <span style="font-size:13px;color:var(--muted)">Ask the choir coordinator for the PIN.</span></div>`;
  }
  return msg + e.sections.map((s,i)=>`<div class="card" data-sec="${i}">
      <div class="row2">
        <div class="field"><label for="sn${i}">Section</label><input id="sn${i}" data-f="name" value="${esc(s.name)}" placeholder="e.g. Opening worship"></div>
        <div class="field"><label for="sl${i}">Lead</label><input id="sl${i}" data-f="lead" value="${esc(s.lead)}" placeholder="Who is leading"></div>
      </div>
      ${s.songs.map((g,j)=>`<div class="songed" data-song="${j}">
        <div class="hd"><span>Song ${j+1}</span><span class="minis">
          <button class="mini" type="button" data-act="up" aria-label="Move up">↑</button>
          <button class="mini" type="button" data-act="down" aria-label="Move down">↓</button>
          <button class="mini" type="button" data-act="rmsong" aria-label="Remove song">✕</button></span></div>
        <div class="field"><label for="st${i}_${j}">Title</label><input id="st${i}_${j}" data-g="t" value="${esc(g.t)}" placeholder="Song title"></div>
        <div class="row2">
          <div class="field"><label for="sa${i}_${j}">Artist (optional)</label><input id="sa${i}_${j}" data-g="by" value="${esc(g.by)}"></div>
          <div class="field"><label for="sy${i}_${j}">YouTube link (optional)</label><input id="sy${i}_${j}" data-g="yt" value="${esc(g.yt)}" placeholder="https://youtu.be/…" inputmode="url"></div>
        </div></div>`).join("")}
      <div class="tools"><button class="tbtn" type="button" data-act="addsong">+ Add song</button>
        <button class="tbtn danger" type="button" data-act="rmsec">Remove section</button></div>
    </div>`).join("") +
    `<div class="tools"><button class="tbtn" type="button" data-act="addsec">+ Add section</button></div>
     <div class="tools"><button class="tbtn primary" type="button" data-act="save" ${e.busy?"disabled":""}>${e.busy?"Saving…":"Save lineup"}</button>
     <button class="tbtn" type="button" data-act="cancel">Cancel</button></div>`;
}

function readEditorInputs(){
  document.querySelectorAll("[data-sec]").forEach(card=>{
    const s = editing.sections[+card.dataset.sec];
    card.querySelectorAll("[data-f]").forEach(inp=> s[inp.dataset.f] = inp.value);
    card.querySelectorAll("[data-song]").forEach(row=>{
      const g = s.songs[+row.dataset.song];
      row.querySelectorAll("[data-g]").forEach(inp=> g[inp.dataset.g] = inp.value);
    });
  });
}

async function editorAction(act, el){
  const e = editing;
  if(act==="cancel"){ editing=null; renderDetail(current); return; }
  if(act==="unlock"){
    const v = $("pinInput").value.trim(); if(!v) return;
    try{ const ok = await rpc("aop_check_pin",{p_pin:v});
      if(ok){ pin=v; try{sessionStorage.setItem("aopPin",v);}catch(_){} e.unlocked=true; e.msg=""; }
      else { e.msg="That PIN didn't work. Check it and try again."; e.err=true; }
    }catch(err){ e.msg="Couldn't check the PIN. Check your connection and try again."; e.err=true; }
    renderDetail(current); return;
  }
  readEditorInputs();
  const card = el.closest("[data-sec]"), si = card ? +card.dataset.sec : -1;
  const row = el.closest("[data-song]"), gi = row ? +row.dataset.song : -1;
  const sec = e.sections[si];
  if(act==="addsong") sec.songs.push({t:"",by:"",yt:""});
  if(act==="rmsong") sec.songs.splice(gi,1);
  if(act==="up" && gi>0) [sec.songs[gi-1],sec.songs[gi]]=[sec.songs[gi],sec.songs[gi-1]];
  if(act==="down" && gi<sec.songs.length-1) [sec.songs[gi+1],sec.songs[gi]]=[sec.songs[gi],sec.songs[gi+1]];
  if(act==="addsec") e.sections.push({id:null,name:"",lead:"",songs:[{t:"",by:"",yt:""}]});
  if(act==="rmsec"){ if(sec.id) e.deleted.push(sec.id); e.sections.splice(si,1); }
  if(act==="save"){ await save(); return; }
  e.msg=""; renderDetail(current);
}

async function save(){
  const e = editing;
  for(const s of e.sections){
    s.name=s.name.trim(); s.lead=s.lead.trim();
    s.songs = s.songs.map(g=>({t:g.t.trim(),by:g.by.trim(),yt:g.yt.trim()})).filter(g=>g.t||g.yt);
    if(!s.name){ e.msg="Give every section a name, e.g. Opening worship or Praise."; e.err=true; renderDetail(current); return; }
    const bad = s.songs.find(g=>!g.t || (g.yt && !/^https?:\/\//i.test(g.yt)));
    if(bad){ e.msg = !bad.t ? "Every song with a link needs a title." : "YouTube links must start with https://"; e.err=true; renderDetail(current); return; }
  }
  e.busy=true; e.msg=""; renderDetail(current);
  try{
    for(const id of e.deleted) await rpc("aop_delete_section",{p_pin:pin,p_section_id:id});
    for(const [i,s] of e.sections.entries()){
      s.id = await rpc("aop_save_section",{p_pin:pin,p_day:e.n,p_slot:e.k,p_section_id:s.id,p_name:s.name,p_lead:s.lead,p_position:i,
        p_songs:s.songs.map(g=>({title:g.t,artist:g.by,youtube_url:g.yt}))});
    }
    editing=null; await load(); renderDetail(current);
    const t=document.createElement("div"); t.className="msg"; t.textContent="Saved. Everyone now sees the updated lineup.";
    $("detailBody").insertBefore(t,$("detailBody").children[1]);
  }catch(err){
    e.busy=false;
    if(/pin/i.test(err.message)){ pin=""; try{sessionStorage.removeItem("aopPin");}catch(_){} e.unlocked=false; e.msg="The PIN was not accepted. Enter it again, then tap Save."; }
    else e.msg="Couldn't save: "+err.message+". Your changes are still here; try Save again.";
    e.err=true; renderDetail(current);
  }
}

/* ---------- Navigation ---------- */
function show(token){
  if(token!==current) editing=null;
  current = token;
  if(token && renderDetail(token)){ $("home").hidden=true; $("detail").hidden=false; }
  else { current=""; $("detail").hidden=true; $("home").hidden=false; }
  window.scrollTo(0,0);
}
let navigated=false;
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go]"); if(b){ navigated=true; location.hash=b.dataset.go; return; }
  const ed=e.target.closest("[data-edit]"); if(ed){ const [n,k]=ed.dataset.edit.split("-"); startEdit(+n,k); return; }
  const a=e.target.closest("[data-act]"); if(a && editing){ editorAction(a.dataset.act, a); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.id==="pinInput") editorAction("unlock", e.target); });
$("backBtn").addEventListener("click",()=>{ if(navigated){ navigated=false; history.back(); } else { location.hash=""; } });
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
renderHome();
show(location.hash.slice(1));
load();
</script>
</body>
</html>
